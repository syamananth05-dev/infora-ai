# Synapse — Netlify configuration
[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Expose functions at /api/*
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Required environment variables (set in Netlify UI → Site settings → Environment variables):
#   OPENROUTER_API_KEY          — your master OpenRouter key (server-side only)
#   SUPABASE_URL                — https://<ref>.supabase.co
#   SUPABASE_ANON_KEY           — public anon key (also used by the client via VITE_)
#   SUPABASE_SERVICE_ROLE_KEY   — server-side only
#   VITE_SUPABASE_URL           — same as SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY      — same as SUPABASE_ANON_KEY
# Optional:
#   OPENROUTER_DEFAULT_MODEL    — e.g. "openai/gpt-4o-mini"
#   APP_URL                     — your site URL (sent as HTTP-Referer to OpenRouter)
