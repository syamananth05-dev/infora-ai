name: Fix cosmetic file corruption

on:
  push:
    paths: ['.github/workflows/fix-chat.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted class names
        run: |
          sed -i 's/text-xh"/text-xl"/' src/routes/Landing.tsx
          sed -i 's/w-340px]/w-[340px]/; s/max-h-;46vh]/max-h-[46vh]/' src/components/chat/ModelPicker.tsx
          sed -i 's/text-m10px]/text-[10px]/' src/routes/Chat.tsx
          git diff --stat

      - name: Typecheck before pushing
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to fix" || (git commit -m "Fix corrupted CSS class names in Landing, ModelPicker, Chat" && git push)
