name: Convert to team workspace

on:
  push:
    paths: ['.github/workflows/fix-chat.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Dashboard and Settings for team usage
        run: |
          python3 << 'PYEOF'
          # --- Dashboard: switch to team usage RPC ---
          p = 'src/routes/Dashboard.tsx'
          s = open(p).read()
          a = "supabase.rpc('get_my_usage_totals')"
          assert s.count(a) == 1, 'dash-anchor1'
          s = s.replace(a, "supabase.rpc('get_team_usage_totals')", 1)
          a2 = "        requests_24h: number;\n        cost_30d: number;\n      };"
          assert s.count(a2) == 1, 'dash-anchor2'
          s = s.replace(a2, "        requests_24h: number;\n        cost_24h: number;\n        active_users: number;\n      };", 1)
          a3 = 'label="Requests (24h)"'
          assert s.count(a3) == 1, 'dash-anchor3'
          s = s.replace(a3, 'label="Team requests (24h)"', 1)
          a4 = 'label="Est. spend"'
          assert s.count(a4) == 1, 'dash-anchor4'
          s = s.replace(a4, 'label="Team est. spend"', 1)
          a5 = '<Stat label="Team est. spend" value={formatCost(usage.total_cost)} />'
          assert s.count(a5) == 1, 'dash-anchor5'
          s = s.replace(a5, a5 + '\n          <Stat label="Active members" value={String(usage.active_users ?? 0)} />', 1)
          a6 = "Here's what's happening in your workspace."
          assert s.count(a6) == 1, 'dash-anchor6'
          s = s.replace(a6, "Your team's shared AI workspace.", 1)
          a7 = "grid grid-cols-2 gap-3 sm:grid-cols-4"
          if s.count(a7) >= 1:
            s = s.replace(a7, "grid grid-cols-2 gap-3 sm:grid-cols-5", 1)
          open(p, 'w').write(s)
          print('Dashboard patched OK')

          # --- Settings: switch to team usage RPC ---
          p = 'src/routes/Settings.tsx'
          s = open(p).read()
          a = "supabase.rpc('get_my_usage')"
          assert s.count(a) == 1, 'set-anchor1'
          s = s.replace(a, "supabase.rpc('get_team_usage')", 1)
          a2 = "supabase.rpc('get_my_usage_totals')"
          assert s.count(a2) == 1, 'set-anchor2'
          s = s.replace(a2, "supabase.rpc('get_team_usage_totals')", 1)
          open(p, 'w').write(s)
          print('Settings patched OK')

          # --- Auth: update text for team workspace ---
          p = 'src/routes/Auth.tsx'
          s = open(p).read()
          a = "One account for your personal AI platform."
          assert s.count(a) == 1, 'auth-anchor1'
          s = s.replace(a, "Join your team's shared AI workspace.", 1)
          open(p, 'w').write(s)
          print('Auth patched OK')

          # --- Landing: update description ---
          p = 'src/routes/Landing.tsx'
          s = open(p).read()
          if 'personal' in s.lower():
            print('Landing has personal text - updating...')
            s = s.replace('Your personal AI workspace', 'Your team\u2019s AI workspace')
            s = s.replace('your personal', 'your team\u2019s')
          open(p, 'w').write(s)
          print('Landing patched OK')
          PYEOF

      - name: Typecheck before pushing
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "nothing to change" || (git commit -m "Convert to team workspace: shared usage stats, team welcome text, auto-confirm signup" && git push)
