name: Update 4a Power features
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/update-4a-power/power_patch.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (docx, pptxgenjs, exceljs)
        run: npm install docx@^8 pptxgenjs@^3.12 exceljs@^4
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 4a: Deep Research + Studio + public report pages"
          git push
