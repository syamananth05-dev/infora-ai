name: Update 2b connector status
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/update-2b/catalog2_patch.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Typecheck
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 2b: honest connector status in catalog (needs sign-in badge)"
          git push
