name: Update 3a PWA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build PWA assets + patch entry files
        run: python3 scripts/update-3a-pwa/pwa_build.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Typecheck
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 3a: PWA - installable app (manifest, icons, service worker)"
          git push
