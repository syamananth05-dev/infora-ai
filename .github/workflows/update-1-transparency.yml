name: Update 1 - Transparency + connectors guide

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-1-transparency.yml']
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply transparency patch
        run: |
          cat > /tmp/transparency.py << 'PYEOF'
          #!/usr/bin/env python3
          """Update 1 (Transparency): Safe Mode flight plan, context gauge, usage pill, Smart Compress."""
          import sys, os

          ROOT = sys.argv[1]

          def patch_file(path, edits, append=None):
              fp = os.path.join(ROOT, path)
              src = open(fp, encoding='utf-8').read()
              orig = src
              for old, new in edits:
                  n = src.count(old)
                  assert n == 1, f"{path}: anchor found {n}x: {old[:70]!r}"
                  src = src.replace(old, new)
              if append:
                  src = src.rstrip('\n') + '\n' + append
              assert src != orig
              open(fp, 'w', encoding='utf-8').write(src)
              print('patched', path)

          # ---------------- types.ts ----------------
          patch_file('src/lib/types.ts', [
              (
                  "  cost_usd: number | null;\n  created_at: string;\n}",
                  "  cost_usd: number | null;\n  created_at: string;\n  compressed?: boolean;\n}",
              ),
              (
                  "  model_hint: string | null;\n  pinned: boolean;",
                  "  model_hint: string | null;\n  summary?: string | null;\n  pinned: boolean;",
              ),
          ])

          # ---------------- api.ts ----------------
          patch_file('src/lib/api.ts', [], append="""
          export async function compressConversation(conversationId: string, model: string): Promise<void> {
            const headers = await authHeaders();
            const res = await fetch(`${EDGE_FUNCTION_BASE}/chat`, {
              method: 'POST',
              headers,
              body: JSON.stringify({ action: 'compress', conversation_id: conversationId, model }),
            });
            if (!res.ok) {
              let message = `Compress failed (${res.status})`;
              try {
                const j = await res.json();
                message = j.message || j.error || message;
              } catch {}
              throw new Error(message);
            }
          }
          """)

          # ---------------- Chat.tsx ----------------
          chat_edits = [
              # imports
              (
                  "import { streamChat, downloadFile } from '../lib/api';",
                  "import { streamChat, downloadFile, compressConversation } from '../lib/api';",
              ),
              (
                  "import { timeAgo, formatTokens, type Message } from '../lib/types';",
                  "import { timeAgo, formatTokens, formatCost, type Message, type ModelInfo } from '../lib/types';",
              ),
              # state
              (
                  "  const [agentMode, setAgentMode] = useState(false);",
                  "  const [agentMode, setAgentMode] = useState(false);\n"
                  "  const [safeMode, setSafeMode] = useState(\n"
                  "    () => (typeof window !== 'undefined' && localStorage.getItem('infora-safe-mode')) === '1'\n"
                  "  );\n"
                  "  const [flightPlan, setFlightPlan] = useState<{ text: string; inTok: number; outTok: number; cost: number } | null>(null);\n"
                  "  const [compressing, setCompressing] = useState(false);",
              ),
              # today usage query
              (
                  "  useEffect(() => setModel(defaultModel), [defaultModel]);",
                  "  useEffect(() => setModel(defaultModel), [defaultModel]);\n\n"
                  "  // Transparency: today's team usage for the free-quota pill\n"
                  "  const { data: today } = useQuery({\n"
                  "    queryKey: ['usage-today'],\n"
                  "    queryFn: async () => {\n"
                  "      const { data, error } = await supabase.rpc('get_today_usage');\n"
                  "      if (error) throw error;\n"
                  "      return data as { requests: number; tokens_in: number; tokens_out: number; cost: number; errors: number };\n"
                  "    },\n"
                  "    refetchInterval: 30000,\n"
                  "  });",
              ),
              # context estimates after display
              (
                  "  const display = streamMsg ? [...path, streamMsg] : path;",
                  "  const display = streamMsg ? [...path, streamMsg] : path;\n\n"
                  "  // Transparency: context gauge + budget\n"
                  "  const ctxTokens = useMemo(() => {\n"
                  "    const live = display.filter((m) => !m.compressed);\n"
                  "    const chars = live.reduce((a, m) => a + m.content.length, 0) + ((conv as any)?.summary?.length ?? 0);\n"
                  "    return Math.ceil(chars / 4);\n"
                  "  }, [display, (conv as any)?.summary]);\n"
                  "  const ctxLimit = modelsData?.models.find((m) => m.id === model)?.context_length ?? 0;\n"
                  "  const requestsLeft = today ? Math.max(0, 50 - today.requests) : null;",
              ),
              # send signature
              (
                  "    async (opts?: { content?: string; parentId?: string | null }) => {",
                  "    async (opts?: { content?: string; parentId?: string | null; model?: string }) => {",
              ),
              # safe mode gate + useModel
              (
                  "      if (streaming) return;\n",
                  "      if (streaming) return;\n\n"
                  "      // Safe Mode: show a flight plan before spending\n"
                  "      if (safeMode && !opts?.content) {\n"
                  "        const estIn = ctxTokens + Math.ceil(text.length / 4) + 120;\n"
                  "        const estOut = agentMode ? 900 : 420;\n"
                  "        const m = modelsData?.models.find((x) => x.id === model);\n"
                  "        const estCost = m\n"
                  "          ? (estIn / 1e6) * (m.input_price_per_1m ?? 0) + (estOut / 1e6) * (m.output_price_per_1m ?? 0)\n"
                  "          : 0;\n"
                  "        setFlightPlan({ text, inTok: estIn, outTok: estOut, cost: estCost });\n"
                  "        return;\n"
                  "      }\n\n"
                  "      const useModel = opts?.model ?? model;\n",
              ),
              # payload model
              (
                  "        mode: agentMode ? 'agent' : 'chat',\n        model,\n",
                  "        mode: agentMode ? 'agent' : 'chat',\n        model: useModel,\n",
              ),
              # placeholder model
              (
                  "        model,\n        tokens_in: null,",
                  "        model: useModel,\n        tokens_in: null,",
               ),
             # invalidate usage-today on done
              (
                  "            qc.invalidateQueries({ queryKey: ['usage-totals'] });",
                  "            qc.invalidateQueries({ queryKey: ['usage-totals'] });\n"
                  "            qc.invalidateQueries({ queryKey: ['usage-today'] });",
              ),
              # deps
              (
                  "    [input, streaming, model, fileMeta, images, path, conversationId, agentMode, session, navigate, qc]",
                  "    [input, streaming, model, fileMeta, images, path, conversationId, agentMode, session, navigate, qc, safeMode, ctxTokens, modelsData]",
              ),
