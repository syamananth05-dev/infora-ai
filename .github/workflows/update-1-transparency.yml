name: Update 1 - Transparency + connectors guide

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-1-transparency.yml']
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild patch scripts
        run: |
          cat scripts/gz/connhelp.aa scripts/gz/connhelp.ab scripts/gz/connhelp.ac scripts/gz/connhelp.ad | gunzip > /tmp/connhelp_patch.py
          cat scripts/gz/transparency.aa scripts/gz/transparency.ab scripts/gz/transparency.ac scripts/gz/transparency.ad scripts/gz/transparency.ae | gunzip > /tmp/transparency_patch.py
      - name: Apply patches
        run: |
          python3 /tmp/transparency_patch.py .
          python3 /tmp/connhelp_patch.py ./src/routes/Settings.tsx
      - name: Typecheck
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Update 1 (Transparency): Safe Mode, context gauge, usage pill, Smart Compress + connectors guide" && git push; fi
