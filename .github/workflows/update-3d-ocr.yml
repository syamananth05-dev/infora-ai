name: Update 3d OCR
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/update-3d-ocr/knowledge_ocr_patch.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (adds tesseract.js for OCR)
        run: npm install tesseract.js@^5
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 3d: OCR - scanned PDFs and image uploads become searchable"
          git push
