name: Update 3b Brain frontend
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/update-3b-brain/brain_patch.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (adds pdfjs-dist for PDF support)
        run: npm install pdfjs-dist@^4
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 3b: Knowledge page - upload docs, chat uses them (Brain)"
          git push
