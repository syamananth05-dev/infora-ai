name: Update 2c catalog health check
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'
jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run health check
        run: python3 scripts/update-2c/health_check.py .
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/catalog/status.json public/catalog/featured.json
          git diff --cached --quiet || (git commit -m "Update 2c: catalog health check + badge fixes" && git push)
