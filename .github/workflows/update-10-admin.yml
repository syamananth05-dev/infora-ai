name: Update 10 Admin
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python3 scripts/update-10-admin/patch.py .
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install + typecheck
        run: |
          npm install
          npx tsc --noEmit -p tsconfig.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update 10: admin dashboard + analytics excel"
          git push
